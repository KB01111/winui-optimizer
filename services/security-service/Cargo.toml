[package]
name = "security-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Least-privilege Windows background security service."

[lib]
name = "security_service"
path = "src/lib.rs"

[[bin]]
name = "security-service"
path = "src/main.rs"

[dependencies]
security-core = { workspace = true }
security-policy = { workspace = true }
security-storage = { workspace = true }
security-scanner = { workspace = true }
security-telemetry = { workspace = true }
security-ipc = { workspace = true }
ai-decisions = { workspace = true }
ai-local = { workspace = true }
windows-integration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
