[package]
name = "tauri-app"
version = "1.0.0"
description = "AI Antivirus — deterministic security engine with an AI decision layer"
authors = ["AI Antivirus contributors"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
security-core = { workspace = true }
security-policy = { workspace = true }
security-storage = { workspace = true }
security-scanner = { workspace = true }
security-telemetry = { workspace = true }
security-ipc = { workspace = true }
ai-decisions = { workspace = true }
ai-local = { workspace = true }
windows-integration = { workspace = true }

tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
